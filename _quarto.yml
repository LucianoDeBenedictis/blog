project:
  type: website
  output-dir: docs

execute: 
  freeze: auto

website:
  title: "Luciano's blog"
  site-url: https://lucianodebenedictis.github.io/blog/
  description: "Desktop ecology"
  navbar:
    background: primary
    right:
      - index.qmd
      - resources.qmd
      - about.qmd
      - text: Electronics
        href: https://bentfishbowl.wixsite.com/electronics
      - icon: rss
        href: index.xml
      - icon: github
        href: https://github.com/LucianoDeBenedictis/blog
  repo-url: https://github.com/LucianoDeBenedictis/blog
  repo-actions: [edit, source, issue]
  open-graph: true
  comments: 
    giscus: 
      repo: LucianoDeBenedictis/blog
      repo-id: R_kgDOQ9cC-w
      category: Announcements
      category-id: DIC_kwDOQ9cC-84DCkDj
      mapping: pathname
      reactions-enabled: true
      input-position: top
      theme: preferred_color_scheme
      loading: lazy
        
format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true


