project:
  type: website
  output-dir: docs

execute: 
  freeze: auto

website:
  title: "Luciano's blog"
  site-url: https://lucianodebenedictis.github.io/blog/
  navbar:
    background: primary
    right:
      - index.qmd
      - resources.qmd
      - about.qmd
      - text: Electronics
        href: https://bentfishbowl.wixsite.com/electronics
      - icon: rss
        href: index.xml
      - icon: github
        href: https://github.com/LucianoDeBenedictis/blog
  repo-url: https://github.com/LucianoDeBenedictis/blog
  repo-actions: [edit, source, issue]
  open-graph: true
  draft-mode: unlinked
  page-footer: <span>{{< fa brands creative-commons >}} 2026 Luciano L.M. De Benedictis. All content licensed under [{{< fa brands creative-commons-by >}} Creative Commons CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)</span>

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    
date-format: "D MMM YYYY"


